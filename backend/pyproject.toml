[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoreviewer-backend"
version = "0.1.0"
description = "AI-powered legal document analysis backend"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Tayyab Suhail", email = "your.email@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiofiles>=25.1.0",
    "celery>=5.5.3",
    "fastapi>=0.119.1",
    "gunicorn>=23.0.0",
    "langchain>=1.0.2",
    "langchain-openai>=1.0.1",
    "langfuse>=3.8.1",
    "langgraph>=1.0.1",
    "openai>=2.6.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pypdf2>=3.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "python-docx>=1.2.0",
    "python-json-logger>=4.0.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.20",
    "redis>=7.0.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

dependencies = [
    # FastAPI and core dependencies
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    
    # Production dependencies
    "gunicorn>=21.2.0",
    
    # Utility dependencies
    "python-multipart>=0.0.6",
    "python-json-logger>=2.0.7",
    
    # File processing dependencies
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "aiofiles>=25.1.0",
    "python-magic>=0.4.27",
    
    # AI/Analysis dependencies
    "openai>=2.4.0",
    "tiktoken>=0.5.0",
    
    # LangGraph and LangChain dependencies
    "langgraph>=0.0.60",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langfuse>=2.0.0",
    
    # Background processing
    "redis>=5.0.0",
    "celery>=5.3.0",
    
    # Development and testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/TayyabSuhail123/autoreviewer"
Repository = "https://github.com/TayyabSuhail123/autoreviewer"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.1",
    "types-aiofiles>=25.1.0.20251011",
]
